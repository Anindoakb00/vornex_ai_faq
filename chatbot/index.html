<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vornex AI — Ask Us Anything</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --navy: #08101F;
    --teal: #00C9A7;
    --teal-dim: #009D84;
    --white: #ffffff;
    --off: #F3F5F8;
    --border: #E4E9F0;
    --gray: #8A95A3;
    --text: #2D3748;
  }

  html, body {
    height: 100%;
    font-family: 'Inter', sans-serif;
    background: var(--navy);
    color: var(--text);
  }

  /* ── LAYOUT ── */
  .shell {
    display: flex;
    flex-direction: column;
    height: 100vh;
    max-width: 760px;
    margin: 0 auto;
    background: var(--white);
    box-shadow: 0 0 80px rgba(0,0,0,0.5);
  }

  /* ── HEADER ── */
  .header {
    background: var(--navy);
    padding: 18px 28px;
    display: flex;
    align-items: center;
    gap: 14px;
    flex-shrink: 0;
    border-bottom: 1px solid #1A2A3A;
  }

  .logo-dot {
    width: 10px; height: 10px;
    background: var(--teal);
    border-radius: 50%;
    flex-shrink: 0;
    box-shadow: 0 0 8px rgba(0,201,167,0.6);
  }

  .logo-text {
    font-size: 16px;
    font-weight: 700;
    color: var(--white);
    letter-spacing: 0.06em;
  }

  .header-sub {
    font-size: 12px;
    color: #5A7080;
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .status-dot {
    width: 6px; height: 6px;
    background: var(--teal);
    border-radius: 50%;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* ── MESSAGES ── */
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 28px 28px 8px;
    display: flex;
    flex-direction: column;
    gap: 18px;
    scroll-behavior: smooth;
  }

  .messages::-webkit-scrollbar { width: 4px; }
  .messages::-webkit-scrollbar-track { background: transparent; }
  .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  /* ── MESSAGE BUBBLES ── */
  .msg { display: flex; gap: 10px; align-items: flex-start; }
  .msg.user { flex-direction: row-reverse; }

  .avatar {
    width: 32px; height: 32px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 600;
  }

  .avatar.bot { background: var(--navy); color: var(--teal); font-size: 15px; }
  .avatar.user { background: var(--teal); color: var(--navy); }

  .bubble {
    max-width: 78%;
    padding: 13px 16px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.65;
    color: var(--text);
  }

  .msg.bot .bubble {
    background: var(--off);
    border-radius: 4px 16px 16px 16px;
    border: 1px solid var(--border);
  }

  .msg.user .bubble {
    background: var(--navy);
    color: var(--white);
    border-radius: 16px 4px 16px 16px;
  }

  /* ── TYPING ── */
  .typing-bubble {
    background: var(--off);
    border: 1px solid var(--border);
    border-radius: 4px 16px 16px 16px;
    padding: 14px 18px;
    display: flex; gap: 5px; align-items: center;
  }

  .typing-dot {
    width: 7px; height: 7px;
    background: var(--gray);
    border-radius: 50%;
    animation: bounce 1.2s infinite;
  }
  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }

  @keyframes bounce {
    0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
    40% { transform: translateY(-6px); opacity: 1; }
  }

  /* ── SUGGESTIONS ── */
  .suggestions {
    padding: 0 28px 12px;
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    flex-shrink: 0;
  }

  .suggestion {
    font-size: 12px;
    padding: 6px 13px;
    border: 1px solid var(--teal-dim);
    border-radius: 20px;
    color: var(--teal-dim);
    background: transparent;
    cursor: pointer;
    transition: all 0.15s;
    font-family: 'Inter', sans-serif;
    white-space: nowrap;
  }

  .suggestion:hover {
    background: var(--teal);
    border-color: var(--teal);
    color: var(--navy);
    font-weight: 600;
  }

  /* ── INPUT BAR ── */
  .input-bar {
    padding: 16px 20px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 10px;
    align-items: flex-end;
    flex-shrink: 0;
    background: var(--white);
  }

  .input-wrap {
    flex: 1;
    background: var(--off);
    border: 1.5px solid var(--border);
    border-radius: 24px;
    display: flex;
    align-items: center;
    padding: 0 16px;
    transition: border-color 0.2s;
  }

  .input-wrap:focus-within {
    border-color: var(--teal);
  }

  #userInput {
    flex: 1;
    border: none;
    background: transparent;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    color: var(--text);
    padding: 12px 0;
    outline: none;
    resize: none;
    max-height: 120px;
    line-height: 1.5;
  }

  #userInput::placeholder { color: var(--gray); }

  .send-btn {
    width: 42px; height: 42px;
    background: var(--navy);
    border: none;
    border-radius: 50%;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s, transform 0.1s;
    flex-shrink: 0;
  }

  .send-btn:hover { background: var(--teal-dim); }
  .send-btn:active { transform: scale(0.93); }

  .send-btn svg {
    width: 17px; height: 17px;
    stroke: var(--white); fill: none;
    stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
  }

  /* ── FOOTER ── */
  .footer {
    text-align: center;
    padding: 8px 0 12px;
    font-size: 11px;
    color: var(--gray);
    flex-shrink: 0;
  }

  .footer a { color: var(--teal-dim); text-decoration: none; }

  /* ── WELCOME CARD ── */
  .welcome {
    background: linear-gradient(135deg, var(--navy) 0%, #1B2A3E 100%);
    border-radius: 12px;
    padding: 24px 22px;
    color: var(--white);
    margin-bottom: 4px;
  }

  .welcome-logo {
    display: flex; align-items: center; gap: 8px; margin-bottom: 12px;
  }

  .welcome h2 {
    font-size: 18px; font-weight: 700; margin-bottom: 8px;
    line-height: 1.3;
  }

  .welcome h2 em { font-style: italic; color: var(--teal); }

  .welcome p {
    font-size: 13px; color: #8A9BAD; line-height: 1.65;
  }
</style>
</head>
<body>

<div class="shell">

  <!-- HEADER -->
  <div class="header">
    <div class="logo-dot"></div>
    <div class="logo-text">VORNEX AI</div>
    <div class="header-sub">
      <div class="status-dot"></div>
      Online · AI Assistant
    </div>
  </div>

  <!-- MESSAGES -->
  <div class="messages" id="messages">

    <!-- Welcome card as first message -->
    <div class="msg bot">
      <div class="avatar bot">V</div>
      <div class="bubble" style="max-width:88%; padding:0; background:transparent; border:none;">
        <div class="welcome">
          <div class="welcome-logo">
            <div class="logo-dot"></div>
            <span style="font-size:13px; font-weight:700; letter-spacing:0.06em;">VORNEX AI</span>
          </div>
          <h2>Hi there. How can we <em>help your business</em> today?</h2>
          <p>Ask me anything about our AI automation services, how we work, pricing, or whether we're the right fit for your business. I'm here 24/7.</p>
        </div>
      </div>
    </div>

  </div>

  <!-- SUGGESTIONS -->
  <div class="suggestions" id="suggestions">
    <button class="suggestion" onclick="sendSuggestion(this.textContent)">What services do you offer?</button>
    <button class="suggestion" onclick="sendSuggestion(this.textContent)">How much does it cost?</button>
    <button class="suggestion" onclick="sendSuggestion(this.textContent)">How quickly will I see results?</button>
    <button class="suggestion" onclick="sendSuggestion(this.textContent)">Is my data safe?</button>
    <button class="suggestion" onclick="sendSuggestion(this.textContent)">We've tried automation before and it failed</button>
    <button class="suggestion" onclick="sendSuggestion(this.textContent)">How do I get started?</button>
  </div>

  <!-- INPUT -->
  <div class="input-bar">
    <div class="input-wrap">
      <textarea id="userInput" rows="1" placeholder="Ask anything about Vornex AI…" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
    </div>
    <button class="send-btn" onclick="sendMessage()">
      <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
    </button>
  </div>

  <div class="footer">
    Powered by <a href="https://vornex.ai" target="_blank">Vornex AI</a> &nbsp;·&nbsp; Built by <a href="https://epochs.cloud" target="_blank">Epochs</a>
  </div>

</div>

<script>
// ── KNOWLEDGE BASE ─────────────────────────────────────────────────────────
const SYSTEM_PROMPT = `You are the AI assistant for Vornex AI (vornex.ai). You help visitors understand Vornex AI's services, process, and whether it's right for them — and encourage them to book a free AI Audit.

Be warm, confident, and concise. Answer in 2-4 sentences max unless the question genuinely needs more. Never use bullet point lists — write naturally like a knowledgeable human team member. If someone seems ready to start, tell them to email april@vornex.ai or visit vornex.ai.

Here is everything you know about Vornex AI:

ABOUT:
Vornex AI is an AI automation agency. Tagline: "Automate everything. Amplify everyone." They build custom AI automation systems for businesses — not templates, everything is built for the specific client.

SERVICES:
1. Workflow Automation — maps and automates all manual tasks end-to-end permanently
2. AI Chatbot — trains an AI on the client's business, handles leads and books calls 24/7
3. Sales AI — researches leads, qualifies buyers, does outreach and follow-up automatically so sales teams only take calls that close
4. AI Voice Calls — AI voice agents for inbound/outbound calls, lead qualification, appointment booking 24/7
5. AI Task Planner — smart task prioritisation, assignment, and scheduling based on deadlines and capacity
6. Document AI — reads, flags, and summarises contracts and large documentation accurately
7. Compliance AI — reads compliance documents, flags violations and risks, generates reports with audit trails
8. Predictive AI — machine learning models for lead scoring, churn prediction, revenue forecasting
9. Content AI — turns one video/blog/podcast into 30+ pieces of platform-specific content automatically
10. HR & Recruitment AI — reads every CV, scores candidates, books top matches into calendar
11. Business Automation Builder — maps every manual process, builds AI agents for each, unified dashboard

PROCESS:
Step 1: Free AI Audit (30 min call) — maps the business, finds automation opportunities, no obligation
Step 2: Paid Pilot (Day 3, 72 hours) — one automation built and live, small fixed fee, see it work before committing
Step 3: Full Build (Week 2) — everything from the discovery session, fixed setup investment, delivered in days
Step 4: Monthly Retainer (Month 1+) — flat fee, AI improves monthly, monitoring and optimisation included

REAL FAQs (answer these accurately):

Q: I'm not technical at all — will this work for me?
A: That's exactly who they build for. Clients are business owners and operators, not developers. You just tell them what's slowing you down. They handle every technical decision, every integration, every line of code. You approve, they build, you use it. Most of the best clients couldn't name a single tool used — and they don't need to.

Q: What if my business uses tools you've never heard of?
A: They work across 200+ platforms — from obvious ones like HubSpot and Shopify to niche tools most agencies have never touched. If it has an API, they can work with it. Share your tools before the call and they'll tell you exactly what's possible before you commit to anything.

Q: How do I know my business data stays private?
A: Your data never leaves your infrastructure. Everything is built inside your systems — not Vornex's. They don't store your data, don't have access after the project ends, and don't build anything that requires them to. Everything is documented so you can see exactly what touches what.

Q: We've tried automating before and it didn't work.
A: This is common and it's almost never the business's fault. Most automation failures come from template tools applied to specific problems they weren't built for, agencies who don't understand the actual workflow, or solutions that work in demos but not in the real world. Everything Vornex builds starts from your specific process — not a template. It's not considered done until it's working in your actual operation, not a test environment.

Q: How long before we see a return?
A: Average client recoups their full investment within 6 weeks. After that, every month is pure margin — compounding permanently. The free discovery call gives you an honest, specific answer for your operation.

Q: How do I know you're actually good at this?
A: They do a paid pilot before the full build. You see one real automation working in your actual business before committing to anything bigger. You don't trust case studies — you watch it work in your operation. If the pilot doesn't impress you, you don't proceed. That's confidence, not a sales tactic.

Q: What if my team resists the change?
A: They build automations that make teams' lives easier — not harder. The tasks automated are the ones your team already resents doing. Resistance dissolves the moment someone realises they never have to do that thing again. They walk through every automation with the people who use it and build around their workflow, not over it.

Q: Are there hidden costs?
A: No. Discovery call is free. Pilot is a fixed fee agreed upfront. Full build is a fixed setup investment agreed before starting. Monthly retainer is flat and predictable. The only additional costs are third-party tool subscriptions if needed — and those are disclosed before you commit. No invoices that appear from nowhere.

Q: Our business is quite unique — can AI handle our specific processes?
A: Every single client says this. Every one has found at least 8 things worth automating in the discovery call. "Unique" businesses still send emails, process orders, handle enquiries, review documents, and manage people — the tasks change, the patterns don't. The pilot exists precisely for this concern — it proves it works in your operation before you commit.

Q: Is this worth it for a business our size?
A: If you have a team of 3 or more people doing repetitive work — yes. Smallest clients are 5-person teams recovering 20+ hours a week. Largest are 200-person operations saving hundreds of thousands per year. The free discovery call tells you honestly what the return looks like for your specific business size. If it doesn't stack up, they'll say so.

Q: What if our business grows and the system can't keep up?
A: Growth is exactly what they build for. Every automation handles scale — not just today's volume but 3× it. As you grow, the system expands in monthly optimisation sessions. Clients who started with one workflow now run twelve. The system grows because they grow it.

HOW TO GET STARTED:
Book the free 30-minute AI Audit — email april@vornex.ai or visit vornex.ai. No obligation, no pitch, just clarity on exactly what automation can do for your specific business.

TONE RULES:
- Never use bullet points or numbered lists. Write in natural flowing sentences.
- Keep answers short — 2 to 4 sentences unless genuinely more is needed.
- Be warm, confident, direct. Sound like a smart human team member, not a bot.
- Always end with a clear next step if the person seems ready: book the free AI Audit at april@vornex.ai
- Never make up numbers or promises not in the FAQ above.`;

// ── STATE ──────────────────────────────────────────────────────────────────
const GROQ_API_KEY = "gsk_placeholder"; // replaced at runtime via env or prompt
let conversationHistory = [];
let isTyping = false;
let apiKey = "gsk_placeholder";

// ── INIT ───────────────────────────────────────────────────────────────────
window.onload = () => {
  
  document.getElementById("userInput").focus();
};

// ── AUTO RESIZE TEXTAREA ───────────────────────────────────────────────────
function autoResize(el) {
  el.style.height = "auto";
  el.style.height = Math.min(el.scrollHeight, 120) + "px";
}

// ── HANDLE ENTER KEY ───────────────────────────────────────────────────────
function handleKey(e) {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

// ── SEND SUGGESTION ────────────────────────────────────────────────────────
function sendSuggestion(text) {
  document.getElementById("userInput").value = text;
  // Hide suggestions after first use
  document.getElementById("suggestions").style.display = "none";
  sendMessage();
}

// ── ADD MESSAGE TO UI ──────────────────────────────────────────────────────
function addMessage(role, text) {
  const container = document.getElementById("messages");
  const div = document.createElement("div");
  div.className = `msg ${role}`;

  const avatar = document.createElement("div");
  avatar.className = `avatar ${role}`;
  avatar.textContent = role === "bot" ? "V" : "U";

  const bubble = document.createElement("div");
  bubble.className = "bubble";
  bubble.textContent = text;

  div.appendChild(avatar);
  div.appendChild(bubble);
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
  return bubble;
}

// ── SHOW/HIDE TYPING ───────────────────────────────────────────────────────
function showTyping() {
  const container = document.getElementById("messages");
  const div = document.createElement("div");
  div.className = "msg bot";
  div.id = "typing-indicator";

  const avatar = document.createElement("div");
  avatar.className = "avatar bot";
  avatar.textContent = "V";

  const typingDiv = document.createElement("div");
  typingDiv.className = "typing-bubble";
  for (let i = 0; i < 3; i++) {
    const dot = document.createElement("div");
    dot.className = "typing-dot";
    typingDiv.appendChild(dot);
  }

  div.appendChild(avatar);
  div.appendChild(typingDiv);
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}

function hideTyping() {
  const el = document.getElementById("typing-indicator");
  if (el) el.remove();
}

// ── SEND MESSAGE ───────────────────────────────────────────────────────────
async function sendMessage() {
  const input = document.getElementById("userInput");
  const text = input.value.trim();
  if (!text || isTyping) return;

  // Hide suggestions
  document.getElementById("suggestions").style.display = "none";

  // Show user message
  addMessage("user", text);
  input.value = "";
  input.style.height = "auto";

  // Add to history
  conversationHistory.push({ role: "user", content: text });

  // Show typing
  isTyping = true;
  showTyping();

  try {
    const response = await fetch("https://api.groq.com/openai/v1/chat/completions", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${apiKey}`
      },
      body: JSON.stringify({
        model: "llama-3.1-8b-instant",
        messages: [
          { role: "system", content: SYSTEM_PROMPT },
          ...conversationHistory
        ],
        temperature: 0.4,
        max_tokens: 300
      })
    });

    const data = await response.json();
    hideTyping();

    if (data.choices && data.choices[0]) {
      const reply = data.choices[0].message.content;
      conversationHistory.push({ role: "assistant", content: reply });
      addMessage("bot", reply);
    } else if (data.error) {
      addMessage("bot", `Something went wrong: ${data.error.message}. Please check your API key or try again.`);
    }
  } catch (err) {
    hideTyping();
    addMessage("bot", "I'm having trouble connecting right now. Please try again in a moment or email april@vornex.ai directly.");
  }

  isTyping = false;
}
</script>
</body>
</html>
